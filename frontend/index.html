<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIBDP — TSMC Internal Bookmark &amp; Dashboard Portal</title>

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body>

  <!-- Factory Workspace Bar -->
  <div id="workspace-bar">
    <div class="workspace-chips"></div>
  </div>

  <!-- App Container: Sidebar + Main Viewport -->
  <div class="app-container">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search bookmarks... ( / )" autocomplete="off">
          <button id="search-clear" class="search-clear hidden" aria-label="Clear search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-content" id="sidebar-content">
        <!-- Category groups and bookmark items rendered by JS -->
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-ghost sidebar-action" id="btn-add-bookmark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Bookmark</span>
        </button>
        <button class="btn btn-ghost sidebar-action" id="btn-import">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Import</span>
        </button>
        <button class="btn btn-ghost sidebar-action" id="btn-export">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Export</span>
        </button>
        <button class="btn btn-ghost sidebar-action" id="btn-settings" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main id="main-viewport">
      <div id="tab-bar">
        <div class="tab-list"></div>
      </div>

      <div id="content-area">
        <!-- Content rendered by SmartWindow -->
      </div>

      <div id="empty-state">
        <div class="empty-state-content">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <p class="empty-state-title">Open a bookmark from the sidebar to get started</p>
          <p class="empty-state-hint">Press <kbd>/</kbd> to search bookmarks</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="hidden"></div>

  <!-- Context Menu -->
  <div id="context-menu" class="hidden"></div>

  <!-- JavaScript Modules -->
  <script src="js/api.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/utils/fuzzy-search.js" defer></script>
  <script src="js/utils/onetab-parser.js" defer></script>
  <script src="js/utils/keyboard-nav.js" defer></script>
  <script src="js/utils/theme.js" defer></script>
  <script src="js/components/workspace-bar.js" defer></script>
  <script src="js/components/sidebar.js" defer></script>
  <script src="js/components/tab-bar.js" defer></script>
  <script src="js/components/smart-window.js" defer></script>
  <script src="js/components/modal.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
